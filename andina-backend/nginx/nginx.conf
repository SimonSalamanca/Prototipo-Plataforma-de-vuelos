events {
  worker_connections 1024;
}

http {
  upstream gateway_pool {
    least_conn;
    # Dos instancias del API Gateway. Si una cae, nginx deja de enviarle
    # trafico (max_fails/fail_timeout) y todo sigue sirviendose desde la otra.
    # Esta es la mitigacion real del punto unico de fallo del gateway.
    server gateway-a:4000 max_fails=2 fail_timeout=5s;
    server gateway-b:4000 max_fails=2 fail_timeout=5s;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://gateway_pool;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 2s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
